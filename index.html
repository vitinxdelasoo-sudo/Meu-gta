<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Meu GTA</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;top:8px;right:10px;color:#fff;text-align:right;font-weight:bold;text-shadow:0 0 4px #000;font-size:18px}
#msg{position:fixed;top:35%;width:100%;text-align:center;color:#fff;font-size:26px;font-weight:bold;text-shadow:0 0 6px #000;pointer-events:none}
#map{position:fixed;top:8px;left:8px;width:110px;height:110px;border:2px solid #fff;border-radius:50%;background:#222}
#joy{position:fixed;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.2)}

</style></head><body>
<canvas id="map" width="110" height="110"></canvas>
<div id="hud"></div><div id="msg"></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="bA">—</div><div class="btn" id="bUp">▲</div><div class="btn" id="bDn">▼</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,80,260);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.5,400);
const rend=new THREE.WebGLRenderer();
rend.setPixelRatio(Math.min(devicePixelRatio,1.5));
rend.setSize(innerWidth,innerHeight);
document.body.prepend(rend.domElement);
addEventListener('resize',()=>{rend.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,.85));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(50,100,30);scene.add(sun);

const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));
const bx=(w,h,d,c,x=0,y=0,z=0)=>{const m=box(w,h,d,c);m.position.set(x,y,z);return m};

// ===== PESSOA v3 (corpo arredondado, rosto, cabelo, roupa) =====
const GC={},MC={};
const mat=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));
const cyl=(a,b,h,s=10)=>{const k='c'+a+'_'+b+'_'+h+'_'+s;return GC[k]||(GC[k]=new THREE.CylinderGeometry(a,b,h,s))};
const sph=(r,s=10,t=8,ps=0,pl=Math.PI*2,ts=0,tl=Math.PI)=>{const k='s'+[r,s,t,ps,pl,ts,tl].join('_');return GC[k]||(GC[k]=new THREE.SphereGeometry(r,s,t,ps,pl,ts,tl))};
const bxg=(w,h,d)=>{const k='b'+w+'_'+h+'_'+d;return GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d))};
function put(par,geo,c,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);par.add(m);return m}

function person(o){
  const g=new THREE.Group(),u=g.userData,w=o.w||1,F=o.face;
  const pv=(x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);g.add(p);return p};
  // pernas e botas
  u.lL=pv(-.12*w,.88);u.lR=pv(.12*w,.88);
  for(const l of [u.lL,u.lR]){
    put(l,cyl(.105,.07,.78,8),o.pants,0,-.39,0);
    put(l,cyl(.075,.08,.16,8),o.boot,0,-.72,0);
    put(l,bxg(.16,.1,.3),o.boot,0,-.79,.06);
  }
  // quadril e tronco
  put(g,cyl(.22*w,.2*w,.2,10),o.pants,0,.92,0,1,1,.66);
  put(g,cyl(.3*w,.215*w,.6,10),o.shirt,0,1.22,0,1,1,.62);
  if(F){
    put(g,cyl(.3*w+.015,.25*w,.4,10),o.vest,0,1.3,0,1,1,.7);
    put(g,cyl(.218*w,.218*w,.05,10),0x151515,0,.99,0,1,1,.66);
    for(const s of[-1,1])put(g,bxg(.1,.12,.07),o.vest,s*.1*w,1.12,.19);
  }
  if(o.pack)put(g,bxg(.34,.42,.14),o.pack,0,1.28,-.2);
  // braços
  u.aL=pv(-.37*w,1.46);u.aR=pv(.37*w,1.46);
  for(const a of[u.aL,u.aR]){
    put(a,sph(.085,8,6),o.shirt,0,0,0);
    put(a,cyl(.07,.058,.32,8),o.shirt,0,-.17,0);
    put(a,cyl(.056,.044,.28,8),o.glove||o.skin,0,-.45,0);
    put(a,sph(.052,8,6),o.glove||o.skin,0,-.62,0);
  }
  // cabeça
  put(g,cyl(.055,.06,.12,8),o.skin,0,1.57,0);
  put(g,sph(.125,12,10),o.skin,0,1.69,0,1,1.15,1.05);
  if(F){
    for(const s of[-1,1]){
      put(g,sph(.014,6,4),0x111111,s*.045,1.705,.122);
      put(g,bxg(.05,.012,.012),o.hair,s*.045,1.735,.122);
      put(g,sph(.025,6,4),o.skin,s*.125,1.69,0);
    }
    put(g,bxg(.022,.045,.03),o.skin,0,1.675,.13);
    put(g,bxg(.05,.01,.01),0x7a3030,0,1.625,.12);
  }
  const hs=o.hs||'short';
  if(hs!='bald'){
    put(g,sph(.133,12,6,0,Math.PI*2,0,Math.PI*.4),o.hair,0,1.69,0,1,1.15,1.05);
    if(hs!='buzz')put(g,sph(.133,12,6,.78*Math.PI,1.44*Math.PI,.4*Math.PI,.22*Math.PI),o.hair,0,1.69,0,1,1.15,1.05);
    if(hs=='long')put(g,bxg(.27,.36,.08),o.hair,0,1.55,-.1);
  }
  if(o.cap){put(g,sph(.14,12,8,0,Math.PI*2,0,Math.PI*.5),o.cap,0,1.74,0,1,1.05,1.08);put(g,bxg(.2,.02,.13),o.cap,0,1.745,.16)}
  if(o.shades)put(g,bxg(.24,.04,.03),0x0a0a0a,0,1.705,.126);
  if(o.beard)put(g,bxg(.12,.06,.05),o.hair,0,1.61,.105);
  g.scale.y=o.h||1;
  return g;
}
function walk(g,on,dt){const u=g.userData;u.t=(u.t||0)+(on?dt*9:0);const s=on?Math.sin(u.t)*.7:0;u.lL.rotation.x=s;u.lR.rotation.x=-s;u.aL.rotation.x=-s*.8;u.aR.rotation.x=s*.8}
const SK=[0xf1c9a5,0xd9a77a,0xb97a52,0x8a5a3a,0x5c3a24],HR=[0x111111,0x3a2412,0x7a4a1e,0xc9a24a,0x888888];
const SH=[0xc0392b,0x2980b9,0x27ae60,0xf39c12,0x8e44ad,0xecf0f1,0x34495e,0xe67e22,0x16a085];
const randPerson=()=>person({w:R(.9,1.2),h:R(.92,1.06),skin:pick(SK),hair:pick(HR),hs:pick(['short','short','buzz','bald','long']),shirt:pick(SH),pants:pick([0x2b3a55,0x222222,0x4a3b2a,0x556070]),boot:pick([0x111111,0xeeeeee,0x553322]),cap:Math.random()<.3?pick(SH):0,shades:Math.random()<.15,beard:Math.random()<.15});

function label(t,x,y,z,s){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,256,64);g.fillStyle='#fff';g.font='bold 36px sans-serif';g.textAlign='center';g.fillText(t,128,46);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.position.set(x,y,z);sp.scale.set(s*4,s,1);scene.add(sp)}

// ===== MUNDO =====
const g0=box(440,1,440,0x4a8c4a);g0.position.y=-.5;scene.add(g0);
for(let i=-3;i<=3;i++){
  const a=box(14,.1,420,0x333333);a.position.set(i*60,.05,0);scene.add(a);
  const b=box(420,.1,14,0x333333);b.position.set(0,.06,i*60);scene.add(b);
}
for(let i=-3;i<=3;i++)scene.add(bx(.35,.02,420,0xffd800,i*60,.13,0),bx(420,.02,.35,0xffd800,0,.13,i*60));
const blds=[];
const wtex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#889';g.fillRect(0,0,64,64);for(let x=0;x<4;x++)for(let y=0;y<4;y++){g.fillStyle=Math.random()<.6?'#ffe9a0':'#345';g.fillRect(x*16+3,y*16+3,10,10)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})();
function addBld(x,z,w,d,h,col,tex){
  const m=new THREE.MeshLambertMaterial({color:col});
  if(tex){const t=wtex.clone();t.needsUpdate=true;t.repeat.set(w/16,h/16);m.map=t}
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,h/2,z);scene.add(b);
  blds.push({x,z,w,d,h});
}
for(let i=-3;i<3;i++)for(let j=-3;j<3;j++){
  if((i==0&&j==0)||(i==-1&&j==0)||(i==1&&j==1))continue;
  addBld(i*60+30+R(-3,3),j*60+30+R(-3,3),R(22,38),R(22,38),R(10,50),new THREE.Color().setHSL(Math.random(),.2,.6),true);
}
addBld(30,30,30,30,14,0xd4af37,false);label('BANCO',30,18,30,4);
const BANK={x:30,z:11};
const mk=new THREE.Mesh(new THREE.CylinderGeometry(4,4,.3,24),new THREE.MeshBasicMaterial({color:0x00ff66,transparent:true,opacity:.5}));mk.position.set(BANK.x,.3,BANK.z);scene.add(mk);
addBld(90,90,26,26,12,0x3355cc,false);label('DELEGACIA',90,16,90,3);
const pad=new THREE.Mesh(new THREE.CylinderGeometry(8,8,.2,24),new THREE.MeshBasicMaterial({color:0xffdd00}));pad.position.set(-30,.15,30);scene.add(pad);label('HELIPONTO',-30,10,30,3);

function hitB(p,r,y){
  let hit=false;
  for(const b of blds){
    if(y!==undefined&&y>b.h+1)continue;
    const cx=Math.max(b.x-b.w/2,Math.min(b.x+b.w/2,p.x)),cz=Math.max(b.z-b.d/2,Math.min(b.z+b.d/2,p.z));
    const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2>1e-6){const d=Math.sqrt(d2);p.x+=dx/d*(r-d);p.z+=dz/d*(r-d)}else p.x=b.x+b.w/2+r;
      hit=true;
    }
  }
  p.x=Math.max(-205,Math.min(205,p.x));p.z=Math.max(-205,Math.min(205,p.z));
  return hit;
}

// ===== VEÍCULOS =====
const vehs=[],cops=[];
const PROF={
  wedge:[[-2.2,.3],[-2.2,.85],[-1.2,.98],[.9,.78],[2.3,.48],[2.3,.3]],
  gt:[[-2.2,.3],[-2.25,.9],[-1.3,1.02],[.3,.95],[1.4,.82],[2.25,.55],[2.3,.3]]
};
const CAB={
  wedge:[[-1.2,.95],[-.8,1.28],[0,1.3],[.9,.82]],
  gt:[[-1.1,.98],[-.55,1.35],[.45,1.33],[1.05,.88]]
};
const GLASS=new THREE.MeshPhongMaterial({color:0x111a22,shininess:100,specular:0xffffff,side:THREE.DoubleSide});
function prof(pts,w,mat){
  const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
  const g=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:false});
  g.rotateY(Math.PI/2);g.translate(-w/2,0,0);
  return new THREE.Mesh(g,mat);
}
function wheel(rad,wid,x,y,z,g,wheels){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,wid,16).rotateZ(Math.PI/2),new THREE.MeshLambertMaterial({color:0x151515}));
  w.add(new THREE.Mesh(new THREE.CylinderGeometry(rad*.6,rad*.6,wid+.02,12).rotateZ(Math.PI/2),new THREE.MeshLambertMaterial({color:0xbbbbbb})));
  w.add(bx(wid+.04,.06,rad*1.1,0x555555));
  w.position.set(x,y,z);g.add(w);wheels.push(w);
}
function mkVeh(type,x,z,col,cop,style){
  const g=new THREE.Group(),wheels=[];let o,rot=null;
  if(type=='car'){
    const st=style||'wedge';
    const bm=new THREE.MeshPhongMaterial({color:col,shininess:90,specular:0x777777,side:THREE.DoubleSide});
    g.add(prof(PROF[st],2.0,bm),prof(CAB[st],1.55,GLASS));
    g.add(bx(2.0,.06,.4,0x111111,0,.3,-2.15));
    g.add(bx(1.9,.05,.42,0x111111,0,1.12,1.95),bx(.08,.2,.08,0x111111,-.7,1.0,1.95),bx(.08,.2,.08,0x111111,.7,1.0,1.95));
    for(const s of[-1,1]){const h=new THREE.Mesh(new THREE.BoxGeometry(.5,.07,.1),new THREE.MeshBasicMaterial({color:0xffffe0}));h.position.set(s*.65,.55,-2.1);g.add(h)}
    const rz=st=='gt'?2.27:2.21;
    const tl=new THREE.Mesh(new THREE.BoxGeometry(1.6,.08,.05),new THREE.MeshBasicMaterial({color:0xff1111}));
    tl.position.set(0,.72,rz);g.add(tl);
    for(const sx of[-.95,.95])for(const sz of[-1.35,1.35])wheel(.38,.32,sx,.38,sz,g,wheels);
    o={max:42,acc:24,st:1.8,r:2.3};
  } else if(type=='moto'){
    const mm=new THREE.MeshPhongMaterial({color:col,shininess:80});
    for(const sz of[-.85,.85])wheel(.36,.14,0,.36,sz,g,wheels);
    const fr=new THREE.Mesh(new THREE.BoxGeometry(.3,.35,1.1),mm);fr.position.set(0,.7,.05);
    const tk=new THREE.Mesh(new THREE.BoxGeometry(.34,.28,.55),mm);tk.position.set(0,.98,-.2);
    g.add(fr,tk,bx(.3,.1,.6,0x151515,0,.9,.45),bx(.08,.6,.08,0x888888,0,.65,-.8),bx(.6,.06,.06,0x151515,0,1.05,-.7),bx(.16,.16,.08,0xffffcc,0,.9,-.9));
    o={max:50,acc:28,st:2.4,r:1.3};
  } else {
    const b=box(2.4,1.6,5,col);b.position.y=1.2;const t=box(.4,.4,3,col);t.position.set(0,1.6,3.5);rot=box(9,.1,.4,0x111111);rot.position.y=2.4;g.add(b,t,rot);o={max:40,acc:16,st:1.6,r:3};
  }
  if(cop){g.add(bx(.8,.3,.5,0xff0000,-.5,1.42,.2),bx(.8,.3,.5,0x0000ff,.5,1.42,.2))}
  g.position.set(x,0,z);scene.add(g);
  return Object.assign({g,type,v:0,h:0,occ:false,rot,wheels,bs:Math.random()<.5?1:-1,stuck:0},o);
}
function roadPos(){const k=Math.round(R(-3,3))*60+R(-3,3),t=R(-190,190);return Math.random()<.5?{x:k,z:t,h:0}:{x:t,z:k,h:Math.PI/2}}
function addVeh(type,p,col,style){const v=mkVeh(type,p.x,p.z,col,false,style);v.h=p.h||0;v.g.rotation.y=v.h;vehs.push(v)}
const CORES=[0xffcc00,0xe10600,0xff6a00,0x111111,0xf2f2f2,0x1e5bff,0x00a859,0x7a1fa2];
for(let i=0;i<8;i++)addVeh('car',roadPos(),pick(CORES),pick(['wedge','gt']));
for(let i=0;i<3;i++)addVeh('moto',roadPos(),pick(CORES));
addVeh('car',{x:20,z:-4,h:0},0xffcc00,'wedge');
addVeh('car',{x:28,z:-4,h:0},0xe10600,'gt');
addVeh('moto',{x:20,z:4,h:0},0x1e5bff);
addVeh('heli',{x:-30,z:30,h:0},0xcc3333);
function stepVeh(v,ax,ay,dt,vy){
  const g=v.g,th=-ay;
  v.v+=th*v.acc*dt;if(Math.abs(th)<.1)v.v*=Math.pow(.3,dt);
  v.v=Math.max(-v.max/3,Math.min(v.max,v.v));
  let sp=Math.max(-1,Math.min(1,v.v/8));
  if(v.type=='heli'){g.position.y=Math.max(0,Math.min(90,g.position.y+vy*12*dt));if(g.position.y<1)v.v=0;sp=g.position.y>1?1:0;v.rot.rotation.y+=25*dt}
  v.h-=ax*v.st*sp*dt;g.rotation.y=v.h;
  g.position.x-=Math.sin(v.h)*v.v*dt;g.position.z-=Math.cos(v.h)*v.v*dt;
  for(const w of v.wheels)w.rotation.x-=v.v*dt/.38;
  if(hitB(g.position,v.r,v.type=='heli'?g.position.y:undefined))v.v*=-.3;
}

// ===== JOGADOR (personagem original) / NPCs =====
// Para mudar seu personagem, mexa nas cores e opções abaixo.
// hs: 'short' | 'buzz' | 'long' | 'bald'   cap: cor do boné (ex: 0xcc0000)   shades: true/false   beard: true/false
const pl=person({face:1,w:1.1,h:1.04,skin:0xc68e62,hair:0x111111,hs:'buzz',shirt:0x2b2b2b,vest:0x4a5240,pants:0x3a3f2e,boot:0x1a1a1a,glove:0x1a1a1a,pack:0x2f352a,shades:true});
pl.position.set(10,0,0);scene.add(pl);
const npcs=[];
function npcPos(){return{x:Math.round(R(-3,3))*60+(Math.random()<.5?9:-9)+R(-1,1),z:R(-190,190)}}
for(let i=0;i<24;i++){const g=randPerson();const p=npcPos();g.position.set(p.x,0,p.z);scene.add(g);npcs.push({g,a:R(0,6.28),t:R(1,4),dead:0})}

// ===== ENTRADA =====
let ax0=0,ay0=0,act=false,upv=0,dnv=0;
const joy=$('joy'),knob=$('knob');let jid=null;
function jm(t){const r=joy.getBoundingClientRect();let x=(t.clientX-r.left-65)/50,y=(t.clientY-r.top-65)/50;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}ax0=x;ay0=y;knob.style.left=(45+x*50)+'px';knob.style.top=(45+y*50)+'px'}
joy.addEventListener('touchstart',e=>{e.preventDefault();jid=e.changedTouches[0].identifier;jm(e.changedTouches[0])},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier==jid)jm(t)},{passive:false});
const jend=e=>{for(const t of e.changedTouches)if(t.identifier==jid){jid=null;ax0=ay0=0;knob.style.left=knob.style.top='45px'}};
joy.addEventListener('touchend',jend);joy.addEventListener('touchcancel',jend);
const hold=(el,fn)=>{el.addEventListener('touchstart',e=>{e.preventDefault();fn(1)},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();fn(0)})};
hold($('bA'),d=>{if(d)act=true});hold($('bUp'),d=>upv=d);hold($('bDn'),d=>dnv=d);
let lx=null;
rend.domElement.addEventListener('touchstart',e=>{lx=e.changedTouches[0].clientX},{passive:true});
rend.domElement.addEventListener('touchmove',e=>{const x=e.changedTouches[0].clientX;if(lx!==null)camYaw-=(x-lx)*.008;lx=x},{passive:true});
const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='e')act=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const kx=()=>(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
const ky=()=>(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
const kv=()=>(keys.r?1:0)-(keys.f?1:0);

// ===== ESTADO =====
let cur=null,money=0,wanted=0,calm=0,bustT=0,frozen=0,robT=0,bankCd=0,msgT=0,copT=0,camYaw=0,last=performance.now();
const say=(t,s=2.5)=>{$('msg').textContent=t;msgT=s};
const lerpAng=(a,b,t)=>{const d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return a+d*t};
function nearVeh(){let b=null,bd=6;for(const v of vehs){if(v.occ)continue;const d=Math.hypot(v.g.position.x-pl.position.x,v.g.position.z-pl.position.z);if(d<bd){bd=d;b=v}}return b}
const canRob=()=>!cur&&bankCd<=0&&robT<=0&&Math.hypot(pl.position.x-BANK.x,pl.position.z-BANK.z)<5.5;
function clearCops(){for(const c of cops)scene.remove(c.g);cops.length=0}
function spawnCop(pp){let p;for(let i=0;i<10;i++){p=roadPos();if(Math.hypot(p.x-pp.x,p.z-pp.z)>70)break}const c=mkVeh('car',p.x,p.z,0xffffff,true,'gt');c.h=p.h;cops.push(c)}
function busted(){say('PRESO! Perdeu metade do dinheiro',4);money=Math.floor(money/2);wanted=0;clearCops();if(cur){cur.occ=false;cur.v=0;cur=null;pl.visible=true}pl.position.set(90,0,72);frozen=3;bustT=0;robT=0}
const mc=$('map').getContext('2d'),bg=document.createElement('canvas');bg.width=bg.height=110;
const mp=x=>(x+210)*110/420;
(()=>{const g=bg.getContext('2d');g.fillStyle='#3a6';g.fillRect(0,0,110,110);g.fillStyle='#333';for(let i=-3;i<=3;i++){g.fillRect(mp(i*60)-2,0,4,110);g.fillRect(0,mp(i*60)-2,110,4)}g.fillStyle='#999';for(const b of blds)g.fillRect(mp(b.x-b.w/2),mp(b.z-b.d/2),b.w*110/420,b.d*110/420);g.fillStyle='#0f6';g.fillRect(mp(BANK.x)-3,mp(BANK.z)-3,6,6)})();
const dot=(x,z,c)=>{mc.fillStyle=c;mc.fillRect(mp(x)-2,mp(z)-2,4,4)};
const bA=$('bA');

function update(dt){
  const ix=ax0||kx(),iy=ay0||ky(),vy=upv-dnv+kv();
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
  bankCd-=dt;

  if(act){act=false;
    if(frozen>0){}
    else if(cur){
      if(cur.g.position.y>3)say('Pouse antes de sair!');
      else{const g=cur.g;pl.position.set(g.position.x+Math.cos(cur.h)*3,0,g.position.z-Math.sin(cur.h)*3);pl.visible=true;cur.occ=false;cur.v=0;g.position.y=0;cur=null}
    }
    else if(canRob()){robT=6;wanted=Math.max(wanted,3);calm=0;say('ASSALTANDO! Polícia chamada!',3)}
    else{const v=nearVeh();if(v){cur=v;v.occ=true;pl.visible=false}}
  }

  let ps=0,moving=false;
  if(frozen>0)frozen-=dt;
  else if(cur){stepVeh(cur,ix,iy,dt,vy);ps=Math.abs(cur.v);camYaw=lerpAng(camYaw,cur.h,Math.min(1,3*dt))}
  else{
    const l=Math.hypot(ix,iy);
    if(l>.1){
      const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
      const mx=fx*(-iy)+rx*ix,mz=fz*(-iy)+rz*ix;
      pl.position.x+=mx*7*dt;pl.position.z+=mz*7*dt;pl.rotation.y=Math.atan2(mx,mz);ps=7;moving=true;
    }
    hitB(pl.position,.7);
  }
  walk(pl,moving,dt);
  const pp=cur?cur.g.position:pl.position;

  for(const n of npcs){
    if(n.dead>0){n.dead-=dt;if(n.dead<=0){const p=npcPos();n.g.position.set(p.x,0,p.z);n.g.rotation.x=0}continue}
    n.t-=dt;if(n.t<=0){n.a=R(0,6.28);n.t=R(2,5)}
    n.g.position.x+=Math.sin(n.a)*2*dt;n.g.position.z+=Math.cos(n.a)*2*dt;n.g.rotation.y=n.a;
    hitB(n.g.position,.5);walk(n.g,true,dt);
    if(cur&&Math.abs(cur.v)>6&&pp.y<2&&Math.hypot(n.g.position.x-pp.x,n.g.position.z-pp.z)<2.4){
      n.dead=4;n.g.rotation.x=-1.4;wanted=Math.min(5,wanted+1);calm=0;say('Atropelou alguém!',2);
    }
  }

  if(robT>0){
    if(cur||Math.hypot(pl.position.x-BANK.x,pl.position.z-BANK.z)>8){robT=0;say('Você fugiu! Assalto falhou',3)}
    else{robT-=dt;say('ASSALTANDO... '+Math.ceil(robT),.5);
      if(robT<=0){const g=Math.floor(R(5000,15000));money+=g;bankCd=60;say('ASSALTO FEITO! +$'+g,4)}}
  }

  if(wanted>0){
    copT-=dt;if(cops.length<Math.min(6,wanted+1)&&copT<=0){spawnCop(pp);copT=2}
    let near=0,close=0;
    for(let i=cops.length-1;i>=0;i--){
      const c=cops[i],dx=pp.x-c.g.position.x,dz=pp.z-c.g.position.z,d=Math.hypot(dx,dz);
      if(d>150){scene.remove(c.g);cops.splice(i,1);continue}
      if(d<60)near++;if(d<5.5)close++;
      if(c.stuck>0){c.stuck-=dt;c.h+=c.bs*2.5*dt;c.v=8}
      else{
        const hd=Math.atan2(-dx,-dz),df=Math.atan2(Math.sin(hd-c.h),Math.cos(hd-c.h));
        c.h+=Math.max(-1,Math.min(1,df*2))*2.4*dt;
        const tv=d<6?4:14+wanted*3.5;c.v+=(tv-c.v)*Math.min(1,1.5*dt);
      }
      c.g.rotation.y=c.h;
      c.g.position.x-=Math.sin(c.h)*c.v*dt;c.g.position.z-=Math.cos(c.h)*c.v*dt;
      for(const w of c.wheels)w.rotation.x-=c.v*dt/.38;
      if(hitB(c.g.position,c.r))c.stuck=.7;
    }
    if(near==0){calm+=dt;if(calm>12){wanted--;calm=0;if(!wanted)clearCops()}}else calm=0;
    if(close>0&&ps<10&&pp.y<3)bustT+=dt;else bustT=Math.max(0,bustT-dt);
    if(bustT>2)busted();
  } else if(cops.length)clearCops();

  const hel=cur&&cur.type=='heli',D=cur?(hel?24:cur.type=='moto'?13:16):13,H=hel?12:cur?7:8;
  const tg=cur?cur.g.position:pl.position;
  cam.position.lerp(new THREE.Vector3(tg.x+Math.sin(camYaw)*D,tg.y+H,tg.z+Math.cos(camYaw)*D),Math.min(1,6*dt));
  cam.lookAt(tg.x,tg.y+1.5,tg.z);

  $('hud').innerHTML='$'+money+'<br>'+'★'.repeat(wanted)+'☆'.repeat(5-wanted);
  let lab='';
  if(frozen>0)lab='';else if(cur)lab='SAIR';else if(robT>0)lab='...';else if(canRob())lab='ASSALTAR';else if(nearVeh())lab='ENTRAR';
  if(lab!==bA.dataset.l){bA.dataset.l=lab;bA.textContent=lab||'—';bA.style.opacity=lab?1:.4}
  $('bUp').style.display=$('bDn').style.display=hel?'flex':'none';
  mc.drawImage(bg,0,0);
  for(const c of cops)dot(c.g.position.x,c.g.position.z,'#f33');
  dot(pp.x,pp.z,'#fff');
}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);rend.render(scene,cam)}
say('Chegue perto de um carro e toque ENTRAR. Banco = marcador verde',6);
requestAnimationFrame(frame);
</script></body></html>
